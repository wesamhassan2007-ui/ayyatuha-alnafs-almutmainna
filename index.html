<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أيتها النفس المطمئنة</title>
<meta name="description" content="المرحومين من آل بغدادي وآل أيوب">
<meta property="og:title" content="أيتها النفس المطمئنة">
<meta property="og:description" content="المرحومين من آل بغدادي وآل أيوب">
<meta property="og:type" content="website">
<meta property="og:url" content="https://wesamhassan2007-ui.github.io/ayyatuha-alnafs-almutmainna/">

<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700;800&family=Amiri:wght@400;700&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1a2e; --card:#16243d; --ink:#f1ead8; --muted:#a9b3c6; --line:rgba(201,162,74,.28);
  --green:#c9a24a; --green2:#d7b766; --greenSoft:rgba(201,162,74,.14); --gold:#c9a24a; --goldSoft:rgba(201,162,74,.16);
  --danger:#e07a6a; --r:18px; --shadow:0 8px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,sans-serif;font-size:16px}
button,input,select,textarea{font-family:inherit;font-size:16px}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:90px}
.top{background:linear-gradient(160deg,#173f37,#1f5c4f 60%,#2a6f5f);color:#fff;padding:22px 18px 26px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% -20%,rgba(255,255,255,.14),transparent 55%);pointer-events:none}
.top h1{margin:6px 0 4px;font-size:22px;font-weight:800}
.top p{margin:0;opacity:.85;font-size:14px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:#fff;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:99px;font-size:13px}
.content{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.sec-card{display:block;width:100%;text-align:right;border:1px solid var(--line);background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:14px;color:inherit}
.sec-card:active{transform:scale(.99)}
.avatars{display:flex;gap:-8px}
.av{width:56px;height:56px;border-radius:50%;background:var(--greenSoft);color:var(--green);display:grid;place-items:center;font-weight:800;font-size:22px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:44px;height:44px;font-size:18px}
.av.lg{width:84px;height:84px;font-size:32px;border-color:rgba(255,255,255,.85)}
.avatars .av+.av{margin-right:-14px}
.sec-head{display:flex;align-items:center;gap:12px}
.sec-title{font-weight:800;font-size:17px;line-height:1.4}
.sec-sub{color:var(--muted);font-size:13px;margin-top:2px}
.stats-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{background:var(--goldSoft);color:#7a5a1c;border-radius:99px;padding:5px 10px;font-size:13px;font-weight:700}
.chip.g{background:var(--greenSoft);color:var(--green)}
.big-total{display:flex;gap:10px;margin-top:16px}
.big-total div{flex:1;background:rgba(255,255,255,.12);border-radius:14px;padding:10px;text-align:center}
.big-total b{display:block;font-size:22px}
.big-total span{font-size:12px;opacity:.85}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;white-space:nowrap;font-weight:700;color:var(--muted)}
.tab.on{background:var(--green);color:#fff;border-color:var(--green)}
.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.act{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px 12px;text-align:center;box-shadow:var(--shadow);position:relative;transition:transform .15s}
.act:active{transform:scale(.96)}
.act .ic{width:54px;height:54px;margin:0 auto 8px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,var(--greenSoft),#d3e6dd);color:var(--green)}
.act .ic svg{width:30px;height:30px}
.act:nth-child(3n+2) .ic{background:linear-gradient(145deg,var(--goldSoft),#efdcb4);color:#8a6418}
.act b{display:block;font-size:15px}
.act small{color:var(--muted);font-size:13px}
.act .cnt{position:absolute;top:10px;left:10px;background:var(--green);color:#fff;font-size:12px;border-radius:99px;padding:2px 8px;font-weight:700}
.dec-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.dec{text-align:center;max-width:110px}
.dec .t{font-size:12px;opacity:.85;margin-top:6px}
.dec .n{font-weight:800;font-size:14px;line-height:1.3}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;background:var(--green);color:#fff;width:100%}
.btn.gold{background:var(--gold)}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn.sm{width:auto;padding:8px 12px;font-size:14px;border-radius:10px}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.row.sb{justify-content:space-between}
.field{margin-bottom:12px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px;font-weight:700}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--ink)}
.field input:focus,.field select:focus{outline:none;border-color:var(--green2)}
.hint{font-size:13px;color:var(--muted);line-height:1.6}
.note{background:var(--goldSoft);border-radius:12px;padding:10px 12px;font-size:13px;color:#6d5118;line-height:1.6}
.h2{font-size:16px;font-weight:800;margin:4px 0 12px}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
.badge{font-size:12px;border-radius:99px;padding:3px 9px;font-weight:700;background:var(--greenSoft);color:var(--green)}
.badge.admin{background:var(--goldSoft);color:#7a5a1c}
.feed .list-item{align-items:flex-start}
.feed .ic{width:36px;height:36px;border-radius:10px;background:var(--greenSoft);color:var(--green);display:grid;place-items:center;flex:none}
.feed .ic svg{width:20px;height:20px}
.feed .tx{font-size:14px;line-height:1.6}
.feed .tm{font-size:12px;color:var(--muted)}
.bar{height:12px;background:#ece5d6;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#d7ad55);border-radius:99px;transition:width .5s}
.juz{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}
.jz{aspect-ratio:1;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:800;color:var(--muted);font-size:15px;display:grid;place-items:center;position:relative}
.jz.res{border-color:var(--gold);background:var(--goldSoft);color:#7a5a1c}
.jz.mine{box-shadow:0 0 0 2px var(--gold) inset}
.jz.done{background:var(--green);border-color:var(--green);color:#fff}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:middle;background:var(--c)}
.quran{font-family:'Amiri Quran','Amiri',serif;font-size:25px;line-height:2.4;text-align:justify}
.ayah{cursor:pointer;border-radius:8px;padding:0 2px;transition:background .2s}
.ayah:hover,.ayah.sel{background:var(--goldSoft)}
.ayah.play{background:var(--greenSoft)}
.anum{display:inline-grid;place-items:center;width:30px;height:30px;font-size:14px;border:1.5px solid var(--gold);border-radius:50%;color:#8a6418;font-family:'Tajawal';margin:0 4px;vertical-align:middle;line-height:1}
.tafsir{border-right:4px solid var(--gold);background:#fffaf0;border-radius:10px;padding:10px 12px;margin-top:12px;font-size:15px;line-height:1.8}
.surahs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.quick{display:flex;gap:8px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:6px 6px 6px 8px;box-shadow:var(--shadow);margin-bottom:14px}
.quick input{flex:1;border:0;background:transparent;padding:10px;outline:none;min-width:0}
.quick button{border:0;background:var(--green);color:#fff;border-radius:12px;width:42px;height:42px;display:grid;place-items:center;flex:none}
.quick button svg{width:20px;height:20px}
.quick button.mic{background:var(--goldSoft);color:#7a5a1c}
.sheet-bg{position:fixed;inset:0;background:rgba(20,30,27,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px 24px;transform:translateY(105%);transition:transform .25s ease;z-index:50;max-height:88vh;overflow:auto}
.sheet.on{transform:none}
.grab{width:44px;height:5px;background:var(--line);border-radius:9px;margin:4px auto 14px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 12px;font-weight:700;color:var(--ink)}
.choice.on{border-color:var(--green);background:var(--greenSoft);color:var(--green)}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0}
.stepper button{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:24px;font-weight:800;color:var(--green)}
.stepper b{font-size:34px;min-width:60px;text-align:center}
.switch{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.tg{width:50px;height:30px;border-radius:99px;background:#d8d2c4;position:relative;border:0;flex:none}
.tg::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:right .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.on{background:var(--green)}
.tg.on::after{right:23px}
.toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-140%);background:var(--green);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:80;transition:transform .3s;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
.burst{position:fixed;pointer-events:none;z-index:70;font-size:20px;animation:fly 1.1s ease-out forwards}
@keyframes fly{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--x),var(--y)) scale(1.2) rotate(40deg)}}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:30}
.nav button{flex:1;border:0;background:none;color:var(--muted);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--green)}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px}
.logo{width:86px;height:86px;border-radius:26px;background:linear-gradient(150deg,#173f37,#2a6f5f);display:grid;place-items:center;margin:0 auto 16px;color:#f1d796;box-shadow:var(--shadow)}
.logo svg{width:48px;height:48px}
.center{text-align:center}
.demo-tag{display:inline-block;background:var(--goldSoft);color:#7a5a1c;font-size:12px;border-radius:99px;padding:3px 10px;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:20px 0;font-size:14px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ===== الشكل الجديد: ليلي أزرق وذهبي ===== */
html,body{background:radial-gradient(1100px 560px at 50% -12%,#24406b 0%,transparent 62%),var(--bg);font-family:'Noto Naskh Arabic','Amiri',serif}
body{min-height:100vh}
.top{background:linear-gradient(160deg,#0b1424,#16294a 60%,#1f3a63);color:var(--ink);border-bottom:1px solid var(--line)}
.top h1{font-family:'Amiri',serif;color:#f7f1e3;font-weight:700}
.top p{color:var(--muted)}
.iconbtn,.pill{background:rgba(201,162,74,.14);color:var(--ink)}
.av{background:rgba(201,162,74,.16);color:var(--gold);border-color:var(--bg);box-shadow:none}
.av.lg{border-color:var(--gold)}
.chip{color:var(--gold)}
.chip.g{color:var(--gold)}
.big-total div{background:rgba(201,162,74,.10)}
.tab.on,.btn,.act .cnt,.quick button,.toast,.jz.done,.nav button.on,.choice.on{color:#0f1a2e}
.tab.on{background:var(--gold);border-color:var(--gold)}
.btn{background:var(--gold);color:#0f1a2e}
.btn.ghost,.btn.danger{color:var(--gold)}
.btn.ghost{border-color:var(--gold)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.act .ic,.feed .ic{background:rgba(201,162,74,.14);color:var(--gold)}
.act:nth-child(3n+2) .ic{background:rgba(201,162,74,.22);color:#f1d796}
.act .cnt{background:var(--gold)}
.quick button{background:var(--gold)}
.quick button.mic{background:rgba(201,162,74,.16);color:var(--gold)}
.field input,.field select,.field textarea,.choice,.stepper button,.jz{background:#0f1a2e;color:var(--ink)}
.field input:focus,.field select:focus{border-color:var(--gold)}
.choice.on{background:var(--gold)}
.stepper button{color:var(--gold)}
.note,.demo-tag,.badge.admin,.chip{background:rgba(201,162,74,.16);color:#f1d796}
.badge{background:rgba(201,162,74,.14);color:var(--gold)}
.bar{background:rgba(255,255,255,.08)}
.jz{color:var(--muted)}
.jz.res{background:rgba(201,162,74,.2);color:#f1d796}
.ayah.sel{background:rgba(201,162,74,.18)}
.ayah.play{background:rgba(201,162,74,.12)}
.anum{color:var(--gold)}
.tafsir{background:rgba(201,162,74,.08);color:var(--ink)}
.tg{background:rgba(255,255,255,.18)}
.tg.on{background:var(--gold)}
.tg::after{background:#0f1a2e}
.nav{background:#0b1424;border-top:1px solid var(--line)}
.nav button.on{color:var(--gold)}
.sheet{background:var(--card)}
.sheet-bg{background:rgba(5,10,20,.6)}
.logo{background:linear-gradient(150deg,#0b1424,#24406b);color:#f1d796}
.quran{font-family:'Amiri Quran','Amiri',serif;color:#f7f1e3}
.ayah{color:var(--ink)}
.hint,.sec-sub,.feed .tm,.legend,.empty,.act small,.field label{color:var(--muted)}
.quick{background:var(--card)}
.mrole{background:#0f1a2e !important;color:var(--ink) !important;border-color:var(--line) !important}
</style>
</head>

<script>
/* ============ إعدادات ============ */
const APP_URL = 'https://wesamhassan2007-ui.github.io/ayyatuha-alnafs-almutmainna/'; // يُوضع هنا رابط الصفحة بعد نشرها على GitHub
// إعدادات Firebase: تُنسخ من لوحة Firebase. إذا بقيت فارغة تعمل الصفحة كنسخة تجريبية على الجهاز فقط.
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyC_X1pUbB-tD8NCBaIAEM3A3ZF1oV9jysw',
  authDomain: 'ayyatuha-alnafs.firebaseapp.com',
  projectId: 'ayyatuha-alnafs',

const COUNTRY_CODE = '+961'; // رمز الدولة الافتراضي للأرقام التي تبدأ بصفر
const LIVE = !!FIREBASE_CONFIG.apiKey;
const DEMO_CODE = '1234';
const LS = 'ajr_v1', SS = 'ajr_session', REM = 'ajr_rem';

/* ============ أيقونات ============ */
const ICONS = {
  book:'<path d="M3 5c3-1 6-1 9 1 3-2 6-2 9-1v13c-3-1-6-1-9 1-3-2-6-2-9-1z"/><path d="M12 6v13"/>',
  quran:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M12 7.5l1.2 2.4 2.6.4-1.9 1.8.5 2.6L12 13.5l-2.4 1.2.5-2.6-1.9-1.8 2.6-.4z"/>',
  dome:'<path d="M4 21h16M6 21v-7h12v7M6 14c0-4 3-6 6-8 3 2 6 4 6 8M12 3v3M10 21v-4h4v4"/>',
  people:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M15 14.5c3 0 6 2 6 5.5"/>',
  mat:'<rect x="6" y="3" width="12" height="18" rx="2"/><path d="M9 21v-6a3 3 0 016 0v6M9 7h6"/>',
  beads:'<circle cx="12" cy="5" r="1.6"/><circle cx="17" cy="7.5" r="1.6"/><circle cx="18.5" cy="12.5" r="1.6"/><circle cx="16" cy="17" r="1.6"/><circle cx="8" cy="17" r="1.6"/><circle cx="5.5" cy="12.5" r="1.6"/><circle cx="7" cy="7.5" r="1.6"/><path d="M12 18.5v3"/>',
  heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.5-7 10-7 10z"/>',
  scroll:'<path d="M7 4h11a2 2 0 012 2v1h-4M7 4a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7M7 4a2 2 0 012 2v12a2 2 0 01-2 2M11 9h5M11 13h5"/>',
  star:'<path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/>',
  home:'<path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.6-2-3.4-2.4.9a7 7 0 00-2-1.2L14 3h-4l-.5 2.5a7 7 0 00-2 1.2l-2.4-.9-2 3.4 2 1.6a7 7 0 000 2.4l-2 1.6 2 3.4 2.4-.9a7 7 0 002 1.2L10 21h4l.5-2.5a7 7 0 002-1.2l2.4.9 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/>',
  back:'<path d="M9 5l7 7-7 7"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  send:'<path d="M20 4L4 11l6 2 2 6z"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',
  wa:'<path d="M4 20l1.3-4A8 8 0 1112 20a8 8 0 01-4-1z"/><path d="M9 9c0 3 2 5 5 6l1.3-1.3-2-1-.8.8c-1-.4-1.7-1.1-2-2l.8-.8-1-2z"/>',
  bell:'<path d="M6 16V11a6 6 0 1112 0v5l2 2H4zM10 21h4"/>',
  play:'<path d="M8 5l11 7-11 7z"/>',
  pause:'<path d="M8 5v14M16 5v14"/>',
  out:'<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>',
  cam:'<path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'
};
const ic = (n, c='i') => `<svg class="${c}" viewBox="0 0 24 24">${ICONS[n]||ICONS.star}</svg>`;

/* ============ القرآن (نماذج) ============ */

let FB = null;
const D = (...path) => FB.F.doc(FB.db, ...path);
const fbErr = e => { console.error(e); toast('تعذّر الاتصال: ' + (e.code || e.message || '')); };
const secDoc = s => ({title:s.title, deceased:s.deceased, members:Object.fromEntries(s.members.map(m => [m.p, m.role])),
  memberPhones:s.members.map(m => m.p), khatma:S.khatma[s.id] || {round:1, juz:{}}, created:s.created || Date.now()});
const P = {
  log(l){ save(); if (FB) FB.F.setDoc(D('logs', l.id), l).catch(fbErr); },
  section(x){ save(); if (FB) FB.F.setDoc(D('sections', x.id), secDoc(x)).catch(fbErr); },
  juz(x, n){ save(); if (FB) FB.F.updateDoc(D('sections', x.id), {['khatma.juz.' + n]: S.khatma[x.id].juz[n]}).catch(fbErr); },
  khatma(x){ save(); if (FB) FB.F.updateDoc(D('sections', x.id), {khatma: S.khatma[x.id]}).catch(fbErr); },
  delSection(id){ save(); if (FB) FB.F.deleteDoc(D('sections', id)).catch(fbErr); },
  user(p){ save(); if (FB) FB.F.setDoc(D('users', p), S.users[p], {merge:true}).catch(fbErr); },
  config(){ save(); if (FB) FB.F.setDoc(D('config', 'main'), {admins:S.admins, acts:S.acts}).catch(fbErr); }
};
let unsubs = [], secUnsub = null, wasPA = null, laterT;
const later = () => { clearTimeout(laterT); laterT = setTimeout(render, 60); };
function unsubAll(){ unsubs.forEach(f => f()); unsubs = []; if (secUnsub) secUnsub(); secUnsub = null; wasPA = null; }
async function initFirebase(){
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  try {
    const [appM, A, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    const app = appM.initializeApp(FIREBASE_CONFIG);
    FB = {A, F, auth: A.getAuth(app), db: F.getFirestore(app)};
    FB.auth.languageCode = 'ar';
    A.onAuthStateChanged(FB.auth, async u => {
      unsubAll();
      if (!u) { me = null; S.ready = true; render(); return; }
      me = '+' + String(u.email || '').split('@')[0]; S.ready = false; render();
      try {
        if (login.name) { S.users[me] = {name: login.name}; await F.setDoc(D('users', me), {name: login.name}, {merge:true}); }
        const c = await F.getDoc(D('config', 'main'));
        if (!c.exists()) await bootstrap();
        subscribe();
      } catch(e) { fbErr(e); }
    });
  } catch(e) { S.ready = true; render(); fbErr(e); }
}
async function bootstrap(){
  const fresh = seed();
  await FB.F.setDoc(D('config', 'main'), {admins:[me], acts:fresh.acts});
  S.admins = [me];
  for (let i = 0; i < fresh.sections.length; i++) {
    const x = fresh.sections[i]; x.members = [{p:me, role:'admin'}]; x.created = Date.now() + i; S.khatma[x.id] = {round:1, juz:{}};
    await FB.F.setDoc(D('sections', x.id), secDoc(x));
  }
}
function subscribe(){
  const F = FB.F;
  unsubs.push(F.onSnapshot(D('config', 'main'), d => { const c = d.data() || {}; S.admins = c.admins || []; S.acts = c.acts || [];
    if (isPA() !== wasPA) { wasPA = isPA(); subSections(); } later(); }, fbErr));
  unsubs.push(F.onSnapshot(F.collection(FB.db, 'users'), q => { q.forEach(d => S.users[d.id] = d.data()); later(); }, fbErr));
  unsubs.push(F.onSnapshot(F.collection(FB.db, 'logs'), q => { S.logs = q.docs.map(d => d.data()); later(); }, fbErr));
}
function subSections(){
  const F = FB.F; if (secUnsub) secUnsub();
  const col = F.collection(FB.db, 'sections');
  const q = isPA() ? col : F.query(col, F.where('memberPhones', 'array-contains', me));
  secUnsub = F.onSnapshot(q, snap => {
    S.sections = snap.docs.map(d => { const x = d.data(); S.khatma[d.id] = x.khatma || {round:1, juz:{}};
      return {id:d.id, title:x.title, deceased:x.deceased || [], members:Object.entries(x.members || {}).map(([p, role]) => ({p, role})), created:x.created || 0}; })
      .sort((a, b) => a.created - b.created);
    S.ready = true; later(); }, fbErr);
}

function burst(x, y){
  const marks = ['✦','✧','❀','✿','★'];
  for (let i=0;i<14;i++){ const b = document.createElement('div'); b.className='burst'; b.textContent = marks[i%marks.length];
    b.style.left = x+'px'; b.style.top = y+'px'; b.style.color = i%2 ? '#b8892f' : '#2e7a68';
    const a = Math.random()*Math.PI*2, r = 60+Math.random()*80; b.style.setProperty('--x', Math.cos(a)*r+'px'); b.style.setProperty('--y', Math.sin(a)*r-40+'px');
    document.body.appendChild(b); setTimeout(()=>b.remove(), 1200); }
}

/* ============ الإدخال الكتابي والصوتي ============ */
const WORDNUM = {'واحد':1,'وحدة':1,'اثنين':2,'اتنين':2,'ثلاث':3,'تلات':3,'ثلاثة':3,'اربع':4,'اربعة':4,'خمس':5,'خمسة':5,'ست':6,'سبع':7,'ثمان':8,'تمن':8,'تسع':9,'عشر':10,'عشرة':10,'مية':100,'مئة':100};
function parseQuick(text){
  const t = normalize(text.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)));
  let q = (t.match(/\d+/)||[])[0]; q = q ? +q : null;
  if (!q) for (const w in WORDNUM) if (t.split(/\s+/).includes(normalize(w))) { q = WORDNUM[w]; break; }
  let a = null; for (const x of S.acts) if ((x.kw||[]).concat(x.name).some(k => t.includes(normalize(k)))) { a = x; break; }
  let found = null;
  for (const s of mySections()) for (const d of s.deceased) { const parts = normalize(d.name).split(/\s+/);
    const score = parts.filter(p => p.length>1 && t.includes(p)).length; if (score && (!found || score > found.score)) found = {s:s.id, d:d.id, score}; }
  return {a, q: q || 1, found};
}
function doQuick(){
  const v = ($('#quickIn')||{}).value || ''; if (!v.trim()) { toast('اكتب ما أهديته، مثلاً: قرأت جزء للحاجة هيفا'); return; }
  const r = parseQuick(v); if (!r.a) { toast('لم أعرف نوع العمل، جرّب: فاتحة، جزء، زيارة…'); return; }
  openRecord(r.a.id, {q:r.q, s:r.found&&r.found.s, d:r.found&&r.found.d});
}
function doMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('التسجيل الصوتي يعمل في النسخة المنشورة على الهاتف'); return; }
  try { const r = new SR(); r.lang = 'ar'; r.onresult = e => { const t = e.results[0][0].transcript; const i = $('#quickIn'); if (i) i.value = t; doQuick(); };
    r.onerror = () => toast('التسجيل الصوتي غير متاح هنا، وسيعمل في النسخة المنشورة'); r.start(); toast('تكلّم الآن…'); }
  catch(e){ toast('التسجيل الصوتي غير متاح هنا'); }
}

const photoCache = {};
function readPhoto(file, id){
  const fr = new FileReader(); fr.onload = () => { const img = new Image(); img.onload = () => {
    const c = document.createElement('canvas'), m = 320, k = Math.min(1, m/Math.max(img.width,img.height));
    c.width = img.width*k; c.height = img.height*k; c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    photoCache[id] = c.toDataURL('image/jpeg', .82);
    const box = document.querySelector(`[data-did="${id}"] .av`); if (box) box.innerHTML = `<img src="${photoCache[id]}" alt="">`;
  }; img.src = fr.result; }; fr.readAsDataURL(file);
}

  if (d.rec) return openRecord(d.rec);
  if (d.rs) { rec.s = d.rs; rec.d = null; return drawRecord(); }
  if (d.rd) { rec.d = d.rd; return drawRecord(); }
  if (d.q) { rec.q = Math.max(1, rec.q + (+d.q)); return drawRecord(); }
  if (d.qs) { rec.q = +d.qs; return drawRecord(); }
  if (d.surah) { quranSel = {s:+d.surah, a:null}; if (playing) { $('#player').pause(); playing = null; } return render(); }
  if (d.ayah !== undefined) { quranSel.a = quranSel.a === +d.ayah ? null : +d.ayah; return render(); }
  if (d.role) { el.parentNode.querySelectorAll('.choice').forEach(c=>c.classList.remove('on')); el.classList.add('on'); return; }
  if (d.icon) { el.parentNode.querySelectorAll('.choice').forEach(c=>c.classList.remove('on')); el.classList.add('on'); return; }
  if (d.member) return formMember(sec(view.id), d.member);
  if (d.person) return formMember(null, d.person);
  if (d.juz) {
    const s = sec(view.id), k = S.khatma[s.id], j = k.juz[d.juz];
    if (!j) { k.juz[d.juz] = {p:me, done:false}; P.juz(s, d.juz); toast(`حجزت الجزء ${num(d.juz)}، بارك الله فيك`); }
    else if (j.p === me && !j.done) { j.done = true; const L = {id:uid(), s:s.id, d:'all', a:'juz', q:1, p:me, anon:false, ts:Date.now()}; S.logs.push(L); P.log(L);
      const r = el.getBoundingClientRect(); burst(r.left+r.width/2, r.top);
      if (Object.values(k.juz).filter(x=>x.done).length === 30) { k.history = (k.history||0)+1; k.round++; k.juz = {}; P.khatma(s); toast('الله أكبر! تمّت الختمة، تقبّل الله من الجميع'); }
      else { P.juz(s, d.juz); toast(`تقبّل الله، الجزء ${num(d.juz)} مقروء`); } }
    else if (j.p === me && j.done) toast('هذا الجزء قرأته أنت');
    else toast(`هذا الجزء ${j.done?'قرأه':'حجزه'} ${uname(j.p)}`);
    return render();
  }
  switch (d.do) {
    case 'login': { const n = $('#lgName').value.trim(), raw = $('#lgPhone').value, pin = $('#lgPin').value.trim().replace(/[٠-٩]/g, x => '٠١٢٣٤٥٦٧٨٩'.indexOf(x));
      if (!n || raw.replace(/\D/g,'').length < 7) return toast('اكتب الاسم ورقم الهاتف');
      if (!/^\d{4,6}$/.test(pin)) return toast('الرمز السري من ٤ إلى ٦ أرقام');
      const p = toE164(raw); login = {name:n, raw, phone:p};
      if (!LIVE) { S.users[p] = {name:n};
        if (!S.admins.length) { S.admins.push(p); S.sections.forEach(x => { if (!x.members.some(m=>m.p===p)) x.members.unshift({p, role:'admin'}); }); }
        me = p; try { localStorage.setItem(SS, p) } catch(x) {} save(); toast('أهلاً بك'); return go({name:'home'}); }
      el.disabled = true; el.textContent = 'جارٍ الدخول…';
      const email = p.replace('+', '') + '@ajr-family.app', pw = 'ajr#' + pin, A = FB.A;
      A.signInWithEmailAndPassword(FB.auth, email, pw).catch(err => {
        if (['auth/invalid-credential','auth/user-not-found','auth/invalid-login-credentials'].includes(err.code))
          return A.createUserWithEmailAndPassword(FB.auth, email, pw).catch(e2 => { throw e2.code === 'auth/email-already-in-use' ? {code:'wrong-pin'} : e2; });
        throw err; })
      .then(() => toast('أهلاً بك'))
      .catch(err => { toast(err.code === 'wrong-pin' ? 'الرمز السري غير صحيح' : err.code === 'auth/too-many-requests' ? 'محاولات كثيرة، انتظر قليلاً' : 'تعذّر الدخول: ' + (err.code || '')); render(); });
      return; }
    case 'logout': if (LIVE) { FB.A.signOut(FB.auth); return; } me = null; try { localStorage.removeItem(SS) } catch(e) {} login = {}; return render();
    case 'quick': return doQuick();
    case 'mic': return doMic();
    case 'quickNav': return openRecord('fatiha');
    case 'anon': rec.anon = !rec.anon; return drawRecord();
    case 'saveRec': return saveRec(e);
    case 'newSection': return formSection(null);
    case 'secSettings': return formSection(sec(view.id));
    case 'addDec': { const w = document.createElement('div'); w.innerHTML = decRow({id:uid(), t:'المرحوم', name:'', photo:''}); $('#decList').appendChild(w.firstElementChild); return; }
    case 'saveSection': return saveSection(d.id);
    case 'delSection': if (el.dataset.sure) { S.sections = S.sections.filter(s=>s.id!==d.id); P.delSection(d.id); closeSheet(); return go({name:'home'}); }
      el.dataset.sure = 1; el.textContent = 'اضغط مرة أخرى للتأكيد'; return;
    case 'addMember': return formMember(sec(view.id), null);
    case 'saveMember': { const name = $('#mName').value.trim(), raw = d.p || $('#mPhone').value, p = d.p || toE164(raw);
      if (!name || String(raw).replace(/\D/g,'').length < 7) return toast('اكتب الاسم ورقم الهاتف');
      S.users[p] = Object.assign({}, S.users[p], {name}); P.user(p);
      document.querySelectorAll('.mrow').forEach(r => { const x = sec(r.dataset.sid), on = r.querySelector('.tg').classList.contains('on'), role = r.querySelector('.mrole').value;
        const m = x.members.find(y => y.p === p); let ch = false;
        if (on && !m) { x.members.push({p, role}); ch = true; }
        else if (on && m.role !== role) { m.role = role; ch = true; }
        else if (!on && m) { x.members = x.members.filter(y => y.p !== p); ch = true; }
        if (ch) P.section(x); });
      closeSheet(); toast('تم الحفظ'); return render(); }
    case 'mTog': el.classList.toggle('on'); return;
    case 'delMember': { const s = sec(view.id); s.members = s.members.filter(x=>x.p!==d.p); P.section(s); closeSheet(); return render(); }
    case 'addAct': return formAct();
    case 'editAct': return formAct(S.acts.find(x => x.id === d.id));
    case 'delAct': if (el.dataset.sure) { S.acts = S.acts.filter(x => x.id !== d.id); P.config(); closeSheet(); toast('حُذف العمل'); return render(); }
      el.dataset.sure = 1; el.textContent = 'اضغط مرة أخرى للتأكيد'; return;
    case 'delDec': { const row = el.closest('.dec-edit'); if (row) row.remove(); return; }
    case 'saveAct': { const n = $('#aName').value.trim(), u = $('#aUnit').value.trim() || 'مرة'; if (!n) return toast('اكتب اسم العمل');
      const icon = (document.querySelector('[data-icon].on')||{}).dataset.icon || 'star';
      const cur = d.id ? S.acts.find(x => x.id === d.id) : null;
      if (cur) { cur.kw = [...new Set([...(cur.kw||[]).filter(k => k !== cur.name), n])]; Object.assign(cur, {name:n, unit:u, icon}); toast('تم حفظ العمل'); }
      else { S.acts.push({id:'a'+uid(), name:n, unit:u, icon, kw:[n]}); toast('أُضيف العمل لكل الصفحات'); }
      P.config(); closeSheet(); return render(); }
    case 'addAdmin': openSheet(`<div class="h2">مدير جديد للمشروع</div><div class="field"><label>الاسم</label><input id="adName"></div><div class="field"><label>رقم الهاتف</label><input id="adPhone" dir="ltr" inputmode="tel"></div><button class="btn" data-do="saveAdmin">حفظ</button>`); return;
    case 'saveAdmin': { const n = $('#adName').value.trim(), raw = $('#adPhone').value; if (!n || raw.replace(/\D/g,'').length<7) return toast('اكتب الاسم ورقم الهاتف');
      const p = toE164(raw); S.users[p] = S.users[p] || {name:n}; if (!S.admins.includes(p)) S.admins.push(p); P.user(p); P.config(); closeSheet(); return render(); }
    case 'remToggle': S.reminders.on = !S.reminders.on; save(); return render();
    case 'notif': try { if (!('Notification' in window)) throw 0; Notification.requestPermission().then(r => toast(r==='granted'?'تم تفعيل الإشعارات':'لم يُسمح بالإشعارات')).catch(()=>toast('الإشعارات تعمل في النسخة المنشورة')); } catch(x) { toast('الإشعارات تعمل في النسخة المنشورة'); } return;
    case 'reset': if (el.dataset.sure) { S = seed(); me = null; try { localStorage.removeItem(LS); localStorage.removeItem(SS) } catch(x) {} login = {}; return render(); }
      el.dataset.sure = 1; el.textContent = 'اضغط مرة أخرى للتأكيد'; return;
    case 'playSurah': if (playing) { $('#player').pause(); playing = null; return render(); } return playAyah(0);
    case 'giftSurah': { const su = SURAHS.find(x=>x.n===quranSel.s); return openRecord(su.n===1?'fatiha':'sura'); }
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset.photo && e.target.files[0]) readPhoto(e.target.files[0], e.target.dataset.photo);
  if (e.target.id === 'mPick' && e.target.value) formMember(sec(view.id), e.target.value, view.id);
  if (e.target.id === 'remDay') { S.reminders.day = e.target.value; save(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'quickIn') doQuick(); });
if (LIVE) { render(); initFirebase(); } else render();
</script>
</body>
</html>
